<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELTRIX Admin</title>
<style>
body{
background:#070914;
font-family:Arial;
color:white;
padding:20px;
}
.box{
max-width:500px;
margin:auto;
background:#0d1020;
padding:20px;
border-radius:20px;
border:1px solid #22253e;
}
input,textarea{
width:100%;
margin-bottom:15px;
padding:15px;
border-radius:14px;
border:1px solid #333;
background:#090c19;
color:white;
}
button{
width:100%;
height:55px;
border:none;
border-radius:14px;
background:#7c3aed;
color:white;
font-size:18px;
font-weight:bold;
}
</style>
</head>
<body>

<div class="box">
<h1>VELTRIX Admin</h1>
<br>

<input type="text" id="nome" placeholder="Nome do download">
<input type="text" id="tipo" placeholder="Tipo">
<textarea id="descricao" placeholder="Descrição"></textarea>
<input type="text" id="link" placeholder="Link do download">

<button onclick="salvar()">Adicionar Download</button>
</div>

<script type="module">
import { db } from './firebase.js';
import {
collection,
addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

window.salvar = async function(){

const nome = document.getElementById('nome').value;
const tipo = document.getElementById('tipo').value;
const descricao = document.getElementById('descricao').value;
const link = document.getElementById('link').value;

await addDoc(collection(db, "downloads"), {
nome,
tipo,
descricao,
link
});

alert("Download adicionado!");
}
</script>

</body>
</html>
