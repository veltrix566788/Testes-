<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELTRIX</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{background:#070914;color:white;min-height:100vh}
header{padding:25px 18px;border-bottom:1px solid #181b35;background:#080b18}
.logo-area{display:flex;align-items:center;gap:14px}
.logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#c026d3);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:22px}
.logo-text{font-size:32px;font-weight:900}
.container{padding:20px;max-width:900px;margin:auto}
.hero{background:linear-gradient(135deg,#11142b,#150825);padding:25px;border-radius:24px;border:1px solid #242842;margin-top:20px}
.cards{display:grid;gap:18px;margin-top:22px}
.card{background:#0d1020;border:1px solid #242842;border-radius:22px;padding:20px}
.download-btn{width:100%;height:55px;border-radius:16px;border:none;background:#7c3aed;color:white;font-size:18px;font-weight:bold;text-decoration:none;display:flex;align-items:center;justify-content:center;margin-top:15px}
.badge{display:inline-block;background:#7c3aed33;color:#d8b4fe;padding:6px 12px;border-radius:20px;font-size:13px;margin-bottom:12px}
footer{text-align:center;color:#777;padding:30px 10px}
</style>
</head>
<body>

<header>
<div class="logo-area">
<div class="logo">V</div>
<div class="logo-text">VELTRIX</div>
</div>
</header>

<div class="container">
<div class="hero">
<h1>Downloads Oficiais</h1>
<p>Todos os downloads adicionados no painel admin aparecem aqui automaticamente.</p>
</div>

<div class="cards" id="downloads"></div>
</div>

<footer>
© 2026 VELTRIX
</footer>

<script type="module">
import { db } from './firebase.js';
import {
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

async function carregarDownloads(){
const area = document.getElementById('downloads');
area.innerHTML = '';

const querySnapshot = await getDocs(collection(db, "downloads"));

querySnapshot.forEach((doc) => {
const data = doc.data();

area.innerHTML += `
<div class="card">
<span class="badge">${data.tipo}</span>
<h2>${data.nome}</h2>
<p>${data.descricao}</p>
<a class="download-btn" href="${data.link}" target="_blank">Download</a>
</div>
`;
});
}

carregarDownloads();
</script>

</body>
</html>
